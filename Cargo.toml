[package]
name = "firefront-gis-ui"
version = "0.3.4"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
console_error_panic_hook = "0.1.7"
gloo-timers = "0.4.0"
gloo-utils = "0.3.0"
js-sys = "0.3.98"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde-wasm-bindgen = "0.6.5"
stylist = { version = "0.15.1", features = ["yew"] }
wasm-bindgen = "0.2.121"
wasm-bindgen-futures = "0.4.71"
web-sys = { version = "0.3.98", features = [
    "HtmlSelectElement",
    "HtmlImageElement",
] }
yew = { version = "0.23.0", features = ["csr"] }
yew-router = "0.20.0"

[workspace]
members = ["src-tauri"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

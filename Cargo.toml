[package]
name = "firefront-gis-ui"
version = "0.3.1"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
console_error_panic_hook = "0.1.7"
gloo-timers = "0.3.0"
gloo-utils = "0.2.0"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.140"
serde-wasm-bindgen = "0.6"
stylist = { version = "0.13.0", features = ["yew"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "HtmlSelectElement",
    "HtmlImageElement",
] }
yew = { version = "0.21", features = ["csr"] }
yew-router = "0.18.0"

[workspace]
members = ["src-tauri"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[package]
name = "firefront-gis"
version = "0.3.3"
description = "GIS application for Firefighters"
authors = ["Donat Fortini"]
edition = "2024"

[lib]
name = "firefront_gis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = "0.4.40"
directories = "6.0.0"
edit-distance = "2.1.3"
futures-util = "0.3.31"
geo = "0.31.0"
geo-types = "0.7.17"
geojson = "0.24.2"
geozero = "0.14.0"
image = { version = "0.25.6", default-features = false, features = [
    "jpeg",
    "png",
    "tiff",
] }
lazy_static = "1"
regex = "1.11.1"
reqwest = { version = "0.12.24", features = ["stream", "hickory-dns"] }
rusqlite = { version = "0.37.0", features = ["bundled"] }
scraper = "0.24.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shapefile = "0.7.0"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
thiserror = "2.0.15"
tiff = "0.10.3"
tokio = { version = "1.44", default-features = false, features = [
    "rt-multi-thread",
    "macros",
    "fs",
    "process",
    "io-util",
] }
wkt = "0.14.0"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
